<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paleo Earth - Maintenance</title>
  <style>
    :root {
      --bg-base: #0f1115;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent: #4a9eff;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .maintenance-container {
      max-width: 600px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: var(--text-primary);
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 0;
    }
    .highlight {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="maintenance-container">
    <div class="icon">🌍🦕</div>
    <h1>Paleo Earth is <span class="highlight">Undergoing Maintenance</span></h1>
    <p>We are currently updating our systems or polishing some fossils behind the scenes.<br><br>The timeline is temporarily paused, but we will be back online shortly. Thank you for your patience!</p>
  </div>
</body>
</html>
